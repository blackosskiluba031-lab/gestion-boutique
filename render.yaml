services:
  - type: web
    name: possibility-tech
    runtime: docker
    plan: free
    region: frankfurt
    envVars:
      # Option 1 : Variables directes TiDB Cloud
      - key: TIDB_HOST
        sync: false
      - key: TIDB_PORT
        value: "4000"
      - key: TIDB_USER
        sync: false
      - key: TIDB_PASSWORD
        sync: false
      - key: TIDB_DATABASE
        value: "test"
      # Option 2 : Ou DATABASE_URL complète fournie par TiDB Cloud
      - key: DATABASE_URL
        sync: false
